<script>
const registerOverlay = document.getElementById('register-overlay');
const getCodeBtn = document.getElementById('get-code-btn');
const getCodeOverlay = document.getElementById('getcode-overlay');

getCodeBtn.onclick = () => {
    registerOverlay.style.display = 'none';
    getCodeOverlay.style.display = 'block';
};

getCodeOverlay.onclick = (e) => {
    if(e.target === getCodeOverlay){

};
